services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securevault-postgres
    restart: always
    environment:
      POSTGRES_DB: securevault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securevault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified Spring Boot Backend Service (Auth, Registration, Login & Vault)
  backend:
    build: ./backend
    container_name: securevault-backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securevault_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-c2VjdXJldmF1bHQtdGVhbTMtZGV2ZWxvcG1lbnQta2V5LWNoYW5nZS1tZS00OC1ieXRlcy1zZWNyZXQh}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Cache (Specified in Project Tech Stack)
  redis:
    image: redis:7-alpine
    container_name: securevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # pgAdmin (Optional Web-based Database GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: securevault-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@securevault.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
