services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securevault-postgres
    restart: always
    environment:
      POSTGRES_DB: securevault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securevault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Specified in Project Tech Stack)
  redis:
    image: redis:7-alpine
    container_name: securevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # pgAdmin (Optional Web-based Database GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: securevault-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@securevault.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
