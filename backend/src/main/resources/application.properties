server.port=8080
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securevault_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
security.jwt.secret-base64=${JWT_SECRET_BASE64:c2VjdXJldmF1bHQtdGVhbTMtZGV2ZWxvcG1lbnQta2V5LWNoYW5nZS1tZS00OC1ieXRlcy1zZWNyZXQh}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
security.vault.encryption-key-base64=${VAULT_ENCRYPTION_KEY_BASE64:}

# Hardened security configurations
spring.servlet.multipart.enabled=false
server.forward-headers-strategy=none
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=8KB

# Web DEBUG/TRACE logging may expose rejected password values during validation.
logging.level.org.springframework.web=INFO
