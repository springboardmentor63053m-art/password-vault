server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securevault_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:securevault_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.mfa.encryption-key-base64=${MFA_ENCRYPTION_KEY_BASE64:${security.jwt.secret-base64}}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
securevault.mail.from=${SECUREVAULT_MAIL_FROM:}

# Hardened security configurations
spring.servlet.multipart.enabled=false
server.forward-headers-strategy=none
security.trusted-proxy-cidrs=${SECUREVAULT_TRUSTED_PROXY_CIDRS:}
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=8KB

# Web DEBUG/TRACE logging may expose rejected password values during validation.
logging.level.org.springframework.web=INFO
