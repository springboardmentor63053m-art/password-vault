<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <h1>Register Page</h1>

      <div class="register-card">
        <aside class="left-panel">
          <div class="brand">
            <div class="brand-badge" aria-hidden="true">
              <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <rect x="31" y="48" width="58" height="42" rx="10" fill="none" stroke="#f7f9fb" stroke-width="6" />
                <path d="M43 48V36C43 23.85 52.85 14 65 14C77.15 14 87 23.85 87 36V48" fill="none" stroke="#f7f9fb" stroke-width="6" stroke-linecap="round" />
                <path d="M51 59.5L60 68L81 47" fill="none" stroke="#f7f9fb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="brand-title">SecureVault</div>
          </div>

          <div class="tagline">SecureVault: A Full-Stack Password Vault &amp; Credential Management System</div>

          <div class="shield-wrap" aria-hidden="true">
            <svg class="shield-svg" viewBox="0 0 340 270" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="shieldGlow" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                  <stop offset="100%" stop-color="#dfeeff" stop-opacity="1" />
                </linearGradient>
              </defs>
              <path d="M170 18C121 51 96 58 85 60C88 118 99 174 170 234C241 174 252 118 255 60C244 58 219 51 170 18Z" fill="none" stroke="url(#shieldGlow)" stroke-width="10" />
              <path d="M170 42C135 62 115 71 109 73C111 116 120 158 170 206C220 158 229 116 231 73C225 71 205 62 170 42Z" fill="none" stroke="url(#shieldGlow)" stroke-width="6" opacity="0.86" />
              <g fill="none" stroke="url(#shieldGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M170 95c-19 18-28 31-32 50 6 16 15 24 32 34 17-10 26-18 32-34-4-19-13-32-32-50Z" opacity="0.9" />
                <path d="M146 125c11-10 22-16 24-28 2 12 13 18 24 28" />
                <path d="M146 158c8 7 18 12 24 18 6-6 16-11 24-18" />
                <path d="M135 87c10 10 19 16 35 16 16 0 25-6 35-16" />
                <path d="M150 94c-7 7-11 14-13 24 5 11 11 16 21 22" />
                <path d="M190 94c7 7 11 14 13 24-5 11-11 16-21 22" />
              </g>
            </svg>
          </div>

          <div class="brand-footer">
            <span class="main">PasswordVault</span>
            <span class="sub">Keep your Passwords Save!</span>
          </div>
        </aside>

        <main class="right-panel">
          <div class="form-area">
            <h2 class="form-title">Create an Account</h2>
            <p class="subtitle">manage your credentials securely</p>

            <form id="registerForm" novalidate>
              <div class="field" data-field="name">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 19c1.6-3.1 5.1-4.5 8-4.5S18.4 15.9 20 19"></path>
                </svg>
                <input type="text" data-field="name" placeholder="Full Name" />
                <small class="error-text"></small>
              </div>

              <div class="field" data-field="email">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"></path>
                  <path d="M4.8 6.5 12 12l7.2-5.5"></path>
                </svg>
                <input type="email" data-field="email" placeholder="Email Address" />
                <small class="error-text"></small>
              </div>

              <div class="field" data-field="role">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="9" cy="8" r="3"></circle>
                  <path d="M3.5 19c.7-3 2.7-4.5 5.5-4.5s4.8 1.5 5.5 4.5M16 8h5M18.5 5.5v5"></path>
                </svg>
                <select data-field="role" required>
                  <option value="" selected disabled>Select Role</option>
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
                <small class="error-text"></small>
              </div>

              <div class="field" data-field="password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                  <path d="M8 11V8.8A4 4 0 0 1 12 5a4 4 0 0 1 4 3.8V11"></path>
                </svg>
                <input id="password" type="password" data-field="password" placeholder="Password" />
                <button class="password-toggle" type="button" aria-label="Show password" data-target="password">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                    <circle cx="12" cy="12" r="3.2"></circle>
                  </svg>
                </button>
                <small class="error-text"></small>
                <div class="password-strength" id="passwordStrength" hidden>
                  <div class="strength-label">Password strength</div>
                  <div class="strength-bar">
                    <span id="strengthFill" class="strength-fill empty"></span>
                  </div>
                  <small id="strengthText" class="strength-text empty">No password</small>
                </div>
              </div>

              <div class="field" data-field="confirmPassword">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                  <path d="M8 11V8.8A4 4 0 0 1 12 5a4 4 0 0 1 4 3.8V11"></path>
                </svg>
                <input id="confirmPassword" type="password" data-field="confirmPassword" placeholder="Confirm Password" />
                <button class="password-toggle" type="button" aria-label="Show password" data-target="confirmPassword">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                    <circle cx="12" cy="12" r="3.2"></circle>
                  </svg>
                </button>
                <small class="error-text"></small>
              </div>

              <div class="checkbox-row" data-field="agree">
                <label>
                  <input type="checkbox" data-field="agree" />
                  <span>I agree to Terms of Service and Privacy Policy</span>
                </label>
                <small class="error-text checkbox-error"></small>
              </div>

              <button class="btn" type="submit">Register</button>
              <div id="formStatus" class="form-status" aria-live="polite"></div>
            </form>

            <p class="login-text">Already have an account? <a href="#">Login here</a></p>
          </div>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
